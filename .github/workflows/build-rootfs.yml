name: Build Ubuntu Installer for Xiaomi Pad 5 (nabu)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Ubuntu Version'
        required: true
        default: '26.04'
      extra_packages:
        description: 'Additional packages to install'
        required: false
        default: ''
      trigger_release:
        description: 'Also create/update GitHub release after build'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils coreutils curl e2fsprogs dosfstools zip pigz git

      - name: Create RootFS Image
        run: |
          VERSION="${{ github.event.inputs.version }}"
          EXTRA_PACKAGES="${{ github.event.inputs.extra_packages }}"
          
          # Create and format image
          truncate -s 12G rootfs.img
          mkfs.ext4 rootfs.img
          mkdir -p rootdir
          sudo mount -o loop rootfs.img rootdir

          # Download and Extract Ubuntu Base
          URL="https://cdimage.ubuntu.com/ubuntu-base/releases/$VERSION/release/ubuntu-base-$VERSION-base-arm64.tar.gz"
          if ! curl -sI "$URL" | grep -q "200"; then
            URL="https://cdimage.ubuntu.com/ubuntu-base/releases/$VERSION/beta/ubuntu-base-$VERSION-beta-base-arm64.tar.gz"
          fi
          
          wget -q $URL -O ubuntu-base.tar.gz
          sudo tar xzvf ubuntu-base.tar.gz -C rootdir

          # Setup Config Files & Fixes
          sudo mkdir -p rootdir/var/lib/gdm3/.config
          sudo mkdir -p rootdir/etc/skel/.config/dconf
          sudo mkdir -p rootdir/etc/apt/preferences.d
          sudo mkdir -p rootdir/etc/apt/keyrings
          sudo mkdir -p rootdir/etc/apt/sources.list.d
          sudo mkdir -p rootdir/etc/udev/rules.d
          sudo mkdir -p rootdir/etc/modprobe.d
          sudo mkdir -p rootdir/etc/dracut.conf.d
          sudo mkdir -p rootdir/etc/kernel/postinst.d
          sudo mkdir -p rootdir/etc/kernel/postrm.d
          sudo mkdir -p rootdir/usr/share/libcamera/ipa/simple
          sudo mkdir -p rootdir/usr/lib/systemd/system/hexagonrpcd.service.d
          sudo mkdir -p rootdir/usr/lib/systemd/system/iio-sensor-proxy.service.d

          sudo cp root-setup-files/monitors.xml rootdir/var/lib/gdm3/.config/monitors.xml
          sudo cp root-setup-files/monitors.xml rootdir/etc/skel/.config/monitors.xml
          sudo cp root-setup-files/console-setup rootdir/etc/default/console-setup
          sudo cp root-setup-files/user rootdir/etc/skel/.config/dconf/
          sudo cp root-setup-files/bash_aliases rootdir/etc/skel/.bash_aliases
          sudo cp root-setup-files/no-kdump.pref rootdir/etc/apt/preferences.d/no-kdump.pref
          sudo cp root-setup-files/61-dev-root.rules rootdir/etc/udev/rules.d/61-dev-root.rules
          sudo cp root-setup-files/60-dma-heap.rules rootdir/etc/udev/rules.d/60-dma-heap.rules
          sudo cp root-setup-files/60-media.rules rootdir/etc/udev/rules.d/60-media.rules
          sudo cp root-setup-files/80-iio-sensor-proxy.rules rootdir/etc/udev/rules.d/80-iio-sensor-proxy.rules
          sudo cp root-setup-files/ov13b10.yaml rootdir/usr/share/libcamera/ipa/simple/ov13b10.yaml
          sudo cp root-setup-files/ov8856.yaml rootdir/usr/share/libcamera/ipa/simple/ov8856.yaml
          sudo cp root-setup-files/nabu-slpi.conf rootdir/usr/lib/systemd/system/hexagonrpcd.service.d/nabu-slpi.conf
          sudo cp root-setup-files/nabu-ssc.conf rootdir/usr/lib/systemd/system/iio-sensor-proxy.service.d/nabu-ssc.conf
          sudo cp root-setup-files/qcom-iris.conf rootdir/etc/modprobe.d/qcom-iris.conf
          sudo cp root-setup-files/nabu-dsp.conf rootdir/etc/dracut.conf.d/nabu-dsp.conf
          sudo cp root-setup-files/nabu-dsp-boot.service rootdir/etc/systemd/system/nabu-dsp-boot.service
          sudo cp root-setup-files/zz-update-uki rootdir/etc/kernel/postinst.d/zz-update-uki
          sudo chmod +x rootdir/etc/kernel/postinst.d/zz-update-uki
          sudo cp root-setup-files/zz-remove-uki rootdir/etc/kernel/postrm.d/zz-remove-uki
          sudo chmod +x rootdir/etc/kernel/postrm.d/zz-remove-uki

          # Bind Mounts
          sudo mkdir -p rootdir/boot/efi
          sudo mount -o size=512M,mode=0755 -t tmpfs none rootdir/boot/efi
          sudo mount --bind /dev rootdir/dev
          sudo mount --bind /dev/pts rootdir/dev/pts
          sudo mount --bind /proc rootdir/proc
          sudo mount --bind /sys rootdir/sys

          # Network and Hostname
          echo "nameserver 1.1.1.1" | sudo tee rootdir/etc/resolv.conf
          echo "nabu" | sudo tee rootdir/etc/hostname
          echo -e "127.0.0.1 localhost\n127.0.1.1 nabu" | sudo tee rootdir/etc/hosts

          # Chroot execution: Phase 1 (Locales & Keys)
          sudo chroot rootdir /bin/bash <<EOF
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\$PATH
          export DEBIAN_FRONTEND=noninteractive
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          
          # 1. Update the lists
          apt update || true 
          
          # 2. Install certificates and gnupg first
          apt install -y locales ca-certificates gnupg
          
          # 3. Generate en_US.UTF-8
          echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen en_US.UTF-8
          update-locale LANG=en_US.UTF-8
          
          # 4. Switch the current session to the new locale
          export LANG=en_US.UTF-8
          unset LC_ALL
          EOF
          
          sudo cp root-setup-files/xiaomi-nabu.sources rootdir/etc/apt/sources.list.d/xiaomi-nabu.sources
          sudo cp root-setup-files/themojoman.gpg rootdir/etc/apt/keyrings/themojoman.gpg
          
          # Chroot execution: Phase 2 (Packages)
          sudo chroot rootdir /bin/bash <<EOF
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\$PATH
          export DEBIAN_FRONTEND=noninteractive
          export LANG=en_US.UTF-8
          unset LC_ALL
          
          apt update
          apt install -y bash-completion sudo ssh nano micro curl alsa-ucm-conf dracut
          apt install -y rmtfs protection-domain-mapper tqftpserv qrtr-tools
          apt install -y systemd-boot-efi systemd-ukify 
          apt install -y xiaomi-nabu-alsa xiaomi-nabu-firmware
          apt install -y hexagonrpcd libssc iio-sensor-proxy || true
          apt install -y nabu-tablet-mode nabu-autobrightness nabu-torch nabu-pmac || true
          apt install -y libcamera-tools gstreamer1.0-libcamera libspa-0.2-libcamera v4l-utils || true
          apt install -y gnome-software gnome-software-plugin-snap || true
          apt install -y 'linux-image-7.3*' 'linux-headers-7.3*'
          apt install -y zram-config
          apt install -y $EXTRA_PACKAGES
          apt --fix-broken install -y
          
          apt install -y ubuntu-desktop
          apt --fix-broken install -y
          apt upgrade -y
          apt --fix-broken install -y

          # Purge kdump-tools and clean unnecessary dependencies
          apt purge -y kdump-tools makedumpfile kexec-tools crash || true
          apt autoremove --purge -y

          # Setup persist directory, symlinks and permissions for hexagonrpcd & SSC
          mkdir -p /mnt/vendor/persist /lib/firmware/hexagonfs/mnt/vendor
          ln -sfn /mnt/vendor/persist /persist
          ln -sfn /mnt/vendor/persist /lib/firmware/hexagonfs/persist
          ln -sfn /mnt/vendor/persist/sensors /lib/firmware/hexagonfs/sensors
          ln -sfn /mnt/vendor/persist /lib/firmware/hexagonfs/mnt/vendor/persist
          getent passwd fastrpc >/dev/null || useradd --system --user-group --home /run/fastrpc --shell /usr/sbin/nologin fastrpc
          chown -R fastrpc:fastrpc /lib/firmware/hexagonfs 2>/dev/null || true
          install -d -o root -g root -m 0700 /var/lib/tqftpserv/sensors/registry 2>/dev/null || true

          # Ensure default user group membership includes video & render for camera
          if [ -f /etc/adduser.conf ]; then
            sed -i 's/^#*EXTRA_GROUPS=.*/EXTRA_GROUPS="dialout cdrom floppy audio video plugdev users render"/' /etc/adduser.conf
            sed -i 's/^#*ADD_EXTRA_GROUPS=.*/ADD_EXTRA_GROUPS=1/' /etc/adduser.conf
          fi

          sed -i '/ConditionKernelVersion/d' /lib/systemd/system/pd-mapper.service
          sed -i '/^totalmem/ s/^/#/' /usr/bin/init-zram-swapping
          sed -i '/^mem/ s/.*/#&\nmem=10GiB/' /usr/bin/init-zram-swapping

          # Clean up unused non-Qualcomm firmware blobs and apt cache to reduce rootfs size
          rm -rf /lib/firmware/{intel,nvidia,amdgpu,mediatek,radeon,cirrus,brcm,ti-connectivity,i915,mrvl} 2>/dev/null || true
          apt clean
          rm -rf /var/lib/apt/lists/*

          # Enable hardware services
          systemctl enable bluetooth || true
          systemctl enable qrtr-ns.service || true
          systemctl enable hexagonrpcd.service hexagonrpcd-suspend.service hexagonrpcd-resume.service || true
          systemctl enable nabu-pmac.service || true
          systemctl enable nabu-tablet-mode.service || true
          systemctl --global enable nabu-autobrightness.service || true
          systemctl enable iio-sensor-proxy.service || true
          systemctl enable rmtfs.service tqftpserv.service pd-mapper.service || true
          systemctl enable nabu-dsp-boot.service || true
          EOF

          # fstab (keeping commented lines)
          echo "PARTLABEL=linux / ext4 errors=remount-ro,x-systemd.growfs 0 1
          #PARTLABEL=esp /boot/efi vfat umask=0077 0 1
          #PARTLABEL=data /media/data ext4 defaults 0 2
          PARTLABEL=persist /mnt/vendor/persist ext4 ro,noatime,nofail 0 2" | sudo tee rootdir/etc/fstab

          # Export EFI files from /boot/efi or /boot before unmounting
          mkdir -p ./exported-efi
          if [ -d "rootdir/boot/efi/EFI/Ubuntu" ]; then
            sudo cp -a rootdir/boot/efi/EFI/Ubuntu/*.efi ./exported-efi/ 2>/dev/null || true
          fi
          sudo cp -a rootdir/boot/*.efi ./exported-efi/ 2>/dev/null || true
          sudo chown -R $USER:$USER ./exported-efi 2>/dev/null || true

          # Cleanup mounts
          sudo umount rootdir/boot/efi
          sudo umount rootdir/sys
          sudo umount rootdir/proc
          sudo umount rootdir/dev/pts
          sudo umount rootdir/dev
          sudo umount rootdir
          rm -rf rootdir

      - name: Prepare Installer Structure
        run: |
          # 1. Minimize rootfs image
          e2fsck -f rootfs.img -y || true
          resize2fs rootfs.img -M
          mkdir -p ./images
          mv ./rootfs.img ./images/

          # 2. Setup EFI directory
          mkdir -p ./efi
          cp -r ./efi-template/EFI/* ./efi/
          mkdir -p ./efi/Ubuntu
          if [ -d "./exported-efi" ] && [ -n "$(ls -A ./exported-efi 2>/dev/null)" ]; then
            cp -a ./exported-efi/*.efi ./efi/Ubuntu/
          fi

          # Verify that UKI was generated
          if ! ls ./efi/Ubuntu/*.efi >/dev/null 2>&1; then
            echo "::error::No kernel EFI (UKI) generated for Ubuntu! Aborting build."
            exit 1
          fi

          # 3. Create ESP partition image (ESPNABU FAT32)
          truncate -s 270M ./images/esp.img
          mkfs.fat -F 32 -S 4096 -s 1 -n ESPNABU ./images/esp.img
          mkdir -p ./esp-mount
          sudo mount -o loop ./images/esp.img ./esp-mount/
          sudo mkdir -p ./esp-mount/EFI
          sudo cp -r ./efi/* ./esp-mount/EFI/
          sudo umount ./esp-mount
          rmdir ./esp-mount

          # 4. Download WinPE image
          mkdir -p ./installer
          wget "https://github.com/WOAFlasher/WinInstaller/releases/download/WinPE/WinPE23H2.img" -qO ./installer/pe.img

          # 5. Copy fastboot flash scripts
          cp ./fastboot-script/flash-linux.bat .
          cp ./fastboot-script/flash-linux.sh .
          chmod +x flash-linux.sh

      - name: Upload rEFInd Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nabu-ubuntu-rEFInd
          path: |
            bin
            DBKP
            efi
            installer
            META-INF
          retention-days: 90
          compression-level: 5

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-nabu-installer
          path: |
            bin
            DBKP
            efi
            flash-linux.bat
            flash-linux.sh
            images
            installer
            META-INF
          retention-days: 90
          compression-level: 5

  trigger-release:
    if: ${{ github.event.inputs.trigger_release == 'true' || github.event.inputs.trigger_release == true }}
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Trigger create-release workflow
        run: |
          gh workflow run "Create Installer Release" \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f run_id=${{ github.run_id }}
