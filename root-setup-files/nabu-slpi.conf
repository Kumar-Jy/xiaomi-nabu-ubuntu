[Unit]
# hexagonrpcd serves /lib/firmware/hexagonfs, which is a tree of symlinks into
# /mnt/vendor/persist. Start it only after persist is mounted and keep the
# sensor blobs read-only for the daemon.
#
# This drop-in deliberately lives in /etc and does NOT reuse the package's
# /usr/lib/systemd/system/hexagonrpcd.service.d/nabu-slpi.conf filename: a
# same-named /etc file would shadow the package's restart policy, and the copy
# the build used to place in /usr/lib was overwritten by the package anyway.
RequiresMountsFor=/mnt/vendor/persist

[Service]
ReadOnlyPaths=/mnt/vendor/persist /persist /lib/firmware/hexagonfs /sys/devices/soc0
